# Local check of the exercise: `learn check`. Building app runs the static checks on the files
# and keeps their report in the image (/reports), where learn check reads it.
services:
  app:
    build:
      context: ./${SRC:-starter}
      dockerfile: ../Dockerfile
      # Exercises build offline, with the dependencies of the toolchain image only (EXE-09).
      network: none
      args:
        REGISTRY: ${LEARN_REGISTRY:-ghcr.io/gmalnati}
        # The caches of the project are named after the Compose project (ADR 027).
        CACHE_ID: ${COMPOSE_PROJECT_NAME}
      # The exercise folder, from which the Dockerfile reads static.yaml with policy/ (ADR 033).
      additional_contexts:
        exercise: ..
