# Local check of the exercise: `learn check`. Building app runs the program on the cases and
# keeps the reports in the image (/reports), where learn check reads them.
services:
  app:
    build:
      context: ./${SRC:-starter}
      dockerfile: ../Dockerfile
      # Exercises build offline, with the dependencies of the toolchain image only (EXE-09).
      network: none
      args:
        REGISTRY: ${LEARN_REGISTRY:-ghcr.io/gmalnati}
        # The caches of the project are named after the Compose project (ADR 027).
        CACHE_ID: ${COMPOSE_PROJECT_NAME}
      # The exercise folder, from which the Dockerfile mounts cases.yaml (ADR 027).
      additional_contexts:
        exercise: ..
