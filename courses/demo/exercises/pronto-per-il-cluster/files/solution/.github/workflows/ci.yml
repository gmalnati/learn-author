name: CI
on: [push, pull_request]
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Costruisce l'immagine
        run: docker build -t "saluto:$GITHUB_SHA" .
      # Il titolo arriva allo script come variabile d'ambiente, non come codice da eseguire.
      - name: Ringrazia per la pull request
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "Grazie per $TITLE"
