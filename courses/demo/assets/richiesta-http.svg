<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-labelledby="title">
  <title id="title">Il client invia una richiesta HTTP al server, che restituisce una risposta</title>
  <rect width="640" height="220" fill="#ffffff"/>
  <rect x="24" y="60" width="160" height="100" rx="12" fill="#eef4ff" stroke="#1f3fa8" stroke-width="2"/>
  <text x="104" y="116" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#141a24">Client</text>
  <rect x="456" y="60" width="160" height="100" rx="12" fill="#ecfdf3" stroke="#067647" stroke-width="2"/>
  <text x="536" y="116" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#141a24">Server</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5565"/>
    </marker>
  </defs>
  <line x1="196" y1="90" x2="444" y2="90" stroke="#4a5565" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="78" font-family="monospace" font-size="16" text-anchor="middle" fill="#141a24">GET /saluto</text>
  <line x1="444" y1="134" x2="196" y2="134" stroke="#4a5565" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="160" font-family="monospace" font-size="16" text-anchor="middle" fill="#141a24">200 OK</text>
</svg>
