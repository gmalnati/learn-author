apiVersion: apps/v1
kind: Deployment
metadata:
  name: saluto
spec:
  replicas: 2
  selector:
    matchLabels:
      app: saluto
  template:
    metadata:
      labels:
        app: saluto
    spec:
      # Il pod gira senza privilegi e scrive solo in /tmp.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: saluto
          image: ghcr.io/esempio/saluto:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - contianerPort: 8080
