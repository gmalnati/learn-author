# Manifest of the Rust exercises of the base toolchain (ADR 027): starters and solutions copy this
# file and Cargo.lock. The image caches exactly these crates, so other versions would not build
# offline; the web libraries are in the image toolchain-rust-web.
[package]
name = "app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
